name: Release

# Publishes to npm with a provenance attestation using npm trusted publishing
# (GitHub OIDC): no npm token is stored anywhere.
#
# One-time setup on npmjs.com: package settings -> Trusted Publisher -> GitHub Actions,
# with this repository and workflow file (release.yml), or from the CLI (npm 11.15+):
#   npm trust github behavtest --file release.yml --repo dhrumilbhut/behavtest --allow-publish
# A trusted publisher can only be added to a package that already exists, so a new package
# name needs one manual first publish (a placeholder version) before this workflow can publish.
# Then push a tag like v0.1.0.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # moves the v0 tag that `uses: dhrumilbhut/behavtest@v0` follows
  id-token: write # required for trusted publishing / provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # No registry-url: it writes an _authToken line to .npmrc, and npm then skips the
          # trusted-publishing (OIDC) credentials and the publish is refused (E404/E403).
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm publish --access public
      - name: Move the v0 major tag to this release (the GitHub Action)
        if: startsWith(github.ref_name, 'v0.')
        run: |
          git tag -f v0 "$GITHUB_SHA"
          git push -f origin v0
